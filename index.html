:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#20332e;background:#f4f5ed}*{box-sizing:border-box}body{margin:0;-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:#183c35;color:#eff7e9;padding:28px 18px;display:flex;flex-direction:column;gap:22px}.brand{font-size:23px;font-weight:800;letter-spacing:-.05em;padding:3px 12px}.brand span{color:#eac974}.small{font-size:12px;opacity:.68;font-weight:500;letter-spacing:0}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#dce9dc;text-align:left;border-radius:12px;padding:13px;font-weight:650}.nav button.active,.nav button:hover{background:#31574a;color:white}.sidebottom{margin-top:auto;font-size:12px;line-height:1.6;color:#b8d2c2;padding:12px}main{padding:34px clamp(20px,5vw,75px);max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:27px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#738b78}h1{font-size:clamp(28px,3vw,42px);letter-spacing:-.055em;margin:5px 0 6px}h2{font-size:22px;letter-spacing:-.04em;margin:0}h3{margin:0 0 10px;font-size:17px}.muted{color:#71827a}.top p{margin:0;color:#71827a}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid #cdd9cc;background:#fff;color:#234438;border-radius:10px;padding:10px 15px;font-weight:700}.btn.primary{background:#28644d;border-color:#28644d;color:white}.btn.danger{color:#a9473d}.btn:hover{filter:brightness(.96)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:25px}.stat,.panel,.birdcard,.nestcard{background:white;border:1px solid #e2e9df;border-radius:17px;box-shadow:0 3px 18px #183c3508}.stat{padding:20px}.stat strong{font-size:30px;display:block;margin-top:8px;letter-spacing:-.05em}.stat small{color:#75857b}.panel{padding:22px;margin-bottom:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:15px}.nestcard{padding:19px;text-align:left;width:100%;transition:.15s}.nestcard:hover,.birdcard:hover{border-color:#8cb5a1;transform:translateY(-2px)}.nesttitle{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{border-radius:99px;background:#e6f1e9;color:#27704d;font-size:11px;padding:5px 9px;font-weight:800}.pill.gray{background:#f0f1ec;color:#718078}.pairthumbs{display:flex;align-items:center;margin:18px 0 12px}.avatar{width:61px;height:61px;border-radius:16px;background:#e8eee5;display:grid;place-items:center;color:#769080;font-size:25px;object-fit:cover;flex:none}.bird-placeholder svg{width:82%;height:82%}.pairthumbs .avatar+ .avatar{margin-left:-9px;border:3px solid white}.birdcard{padding:13px;text-align:left;width:100%;display:flex;gap:12px;align-items:center}.birdcard strong{display:block}.birdcard small{color:#798b7f;line-height:1.5}.detailpair{display:grid;grid-template-columns:1fr 1fr;gap:17px}.parent{display:flex;gap:18px;align-items:center;padding:18px;background:#f7faf5;border-radius:16px;min-height:145px}.parent .avatar{width:105px;height:105px;border-radius:15px;font-size:36px}.parent p{margin:4px 0;color:#71827a;font-size:13px}.lineage{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lineage .panel{margin:0}.toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}.toolbar input,.toolbar select{max-width:310px}.empty{padding:36px;text-align:center;border:1px dashed #cbd8cb;border-radius:14px;color:#71827a}.field{display:grid;gap:6px;font-size:13px;font-weight:700;color:#4c6458}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid #cfdcd0;border-radius:10px;background:white;padding:11px 12px;color:#20332e}.field textarea{min-height:82px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.producer-card{display:flex;align-items:center;gap:17px;padding:18px 21px;margin-bottom:20px;background:linear-gradient(110deg,#ffffff,#edf5e9);border:1px solid #d9e7d8;border-radius:18px}.producer-card h2{margin:4px 0}.producer-card p{margin:0;color:#627d6e}.producer-card .btn{margin-left:auto}.producer-logo{width:76px;height:76px;flex:none;display:grid;place-items:center;background:#d9e8d5;border-radius:17px;color:#28644d;font-size:35px;overflow:hidden}.producer-logo img{width:100%;height:100%;object-fit:cover}.photo-preview{width:115px;height:115px;object-fit:cover;border-radius:16px;background:#edf3ea}dialog{border:0;border-radius:19px;padding:0;width:min(660px,calc(100vw - 24px));max-height:90vh;box-shadow:0 20px 80px #12382d55}dialog::backdrop{background:#0c2d29a8}.modal{padding:27px;overflow:auto;max-height:90vh}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.iconbtn{border:0;background:#edf3eb;border-radius:9px;padding:7px 11px;font-size:20px}.link{border:0;background:none;color:#24684e;font-weight:750;padding:0;text-align:left}.subtle{font-size:13px;color:#70847a}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.divider{height:1px;background:#e7ece5;margin:18px 0}.record{border-left:3px solid #b9d6c3;padding:10px 15px;margin:12px 0;background:#f7faf6;border-radius:0 10px 10px 0}.record small{color:#71827a}.breadcrumbs{margin-bottom:15px}.alert{background:#fff7e5;border:1px solid #f0dbab;padding:13px;border-radius:12px;color:#735b20;margin-bottom:16px}.tree{display:grid;gap:11px}.treelevel{display:flex;gap:9px;flex-wrap:wrap}.tag{border:1px solid #dce7db;border-radius:10px;padding:10px 13px;background:#f9fbf8}.tag strong{display:block}.tag small{color:#738679}input[type=file]{padding:8px}.photohelp{font-weight:400;color:#72867a;font-size:12px}@media(max-width:800px){.shell{display:block}aside{padding:calc(14px + env(safe-area-inset-top)) 14px 14px;gap:8px}.brand{font-size:19px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.sidebottom{display:none}main{padding:23px 15px calc(24px + env(safe-area-inset-bottom))}.cards{grid-template-columns:repeat(2,1fr)}.detailpair,.lineage{grid-template-columns:1fr}.top{display:block}.top .actions{margin-top:15px}}@media(max-width:500px){.producer-card{flex-wrap:wrap}.producer-card .btn{margin-left:0;width:100%}.cards{gap:8px}.stat{padding:13px}.stat strong{font-size:24px}.formgrid{grid-template-columns:1fr}.parent .avatar{width:75px;height:75px}.modal{padding:19px}}
</style></head><body><div class="shell"><aside><div class="brand">Kanarya<span>Kütüğü</span><div class="small">Üretim ve soy kayıtları</div></div><div class="nav"><button data-page="dashboard">Genel bakış</button><button data-page="nests">Yuvalar</button><button data-page="birds">Kanaryalar</button><button data-page="broods">Kuluçkalar</button><button data-page="profile">Üretici profili</button><button data-page="backup">Yedekleme</button></div><div class="sidebottom">Kayıtlar bu tarayıcıda saklanır.<br>Belirli aralıklarla yedek indir.</div></aside><main id="app"></main></div><dialog id="dialog"><div class="modal" id="modal"></div></dialog><script>
const BREEDS={ 'Ötüm':['Harz Roller','Malinois Waterslager','İspanyol Timbrado','American Singer'], 'Şekil':['Gloster','Fife Fancy','Border Fancy','Norwich','Yorkshire','Lizard','Lancashire'], 'Renk':['Lipochrom','Melanin','Agat','İsabel'] };const DB='kanarya-kutugu-v1', STORES=['birds','nests','pairings','broods','settings'];let db,route={page:'dashboard'},cache={};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const date=s=>s?new Date(s+'T00:00:00').toLocaleDateString('tr-TR'):'—';const producer=()=>cache.settings?.find(x=>x.id==='producer')||{};const bird=id=>cache.birds.find(x=>x.id===id);const nest=id=>cache.nests.find(x=>x.id===id);const pair=id=>cache.pairings.find(x=>x.id===id);const label=b=>b?.name||b?.ring||'İsimsiz kanarya';const sex=s=>s==='M'?'Erkek':s==='F'?'Dişi':'Bilinmiyor';const photo=(b,cls='avatar')=>b?.photo?`<img class="${cls}" src="${b.photo}" alt="${esc(label(b))}">`:`<span class="${cls} bird-placeholder" style="--plume:${/kırmızı|turuncu/i.test(b?.color||'')?'#dc8257':/beyaz/i.test(b?.color||'')?'#e9e9d9':'#e1be65'}" role="img" aria-label="Fotoğraf yok; temsili kanarya çizimi"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="var(--plume)" d="M10 43c-5-11 6-26 19-26 8 0 13 3 17 9 6 10 2 20-8 23-9 3-17 0-28-6Z"/><circle fill="#243e35" cx="40" cy="26" r="2"/><path fill="#c17a48" d="m47 29 12 3-12 4Z"/><path stroke="#785b3f" stroke-width="2" d="m25 49-2 8m10-8 2 8"/><path fill="#c8954e" d="M13 38 2 52l20-6Z"/></svg></span>`;const btn=(text,click,cls='')=>`<button class="btn ${cls}" data-action="${click}">${text}</button>`;
function openDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open(DB,2);q.onupgradeneeded=()=>STORES.forEach(s=>{if(!q.result.objectStoreNames.contains(s))q.result.createObjectStore(s,{keyPath:'id'})});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}function all(s){return new Promise((res,rej)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(s,v){return new Promise((res,rej)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function del(s,id){return new Promise((res,rej)=>{let t=db.transaction(s,'readwrite');t.objectStore(s).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}async function refresh(){for(const s of STORES)cache[s]=await all(s);render()}function go(page,id){route={page,id};render();window.scrollTo(0,0)}function head(title,sub,actions=''){return `<div class="top"><div><div class="eyebrow">KANARYA KÜTÜĞÜ</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}function birdCard(b){return `<button class="birdcard" data-go="bird:${b.id}">${photo(b)}<span><strong>${esc(label(b))}</strong><small>${esc(b.ring||'Bilezik girilmedi')} · ${sex(b.sex)}<br>${esc(b.color||b.breed||'')}</small></span></button>`}function nestCard(n){let p=cache.pairings.filter(x=>x.nestId===n.id).sort((a,b)=>b.start.localeCompare(a.start))[0],chicks=cache.broods.filter(x=>x.pairingId===p?.id).flatMap(x=>x.chickIds||[]);return `<button class="nestcard" data-go="nest:${n.id}"><div class="nesttitle"><h3>${esc(n.name)}</h3><span class="pill ${p?.end?'gray':''}">${p?(p.end?'Geçmiş':'Aktif'):'Boş'}</span></div><div class="pairthumbs">${photo(bird(p?.maleId))}${photo(bird(p?.femaleId))}</div><strong>${esc(label(bird(p?.maleId)))} + ${esc(label(bird(p?.femaleId)))}</strong><p class="subtle">${p?`${cache.broods.filter(x=>x.pairingId===p.id).length} kuluçka · ${chicks.length} yavru`:'Henüz eşleşme yok'}</p><small class="muted">Aynı yuva farklı dönemlerde tekrar kullanılır.</small></button>`}
function producerCard(){let p=producer(),name=[p.firstName,p.lastName].filter(Boolean).join(' ');return `<div class="producer-card"><div class="producer-logo">${p.logo?`<img src="${p.logo}" alt="${esc(name||'Üretici')} logosu">`:'<span>♪</span>'}</div><div><div class="eyebrow">ÜRETİCİ PROFİLİ</div><h2>${esc(name||'Üretici bilgilerini ekle')}</h2><p>${esc(p.federation||'Federasyon veya kulüp adını ekle')}</p></div><button class="btn" data-action="profile">${name?'Düzenle':'Profil oluştur'}</button></div>`}
function profile(){let p=producer();return head('Üretici profili','Adın, federasyon/kulüp bilgin ve logon ana ekranda görünür.',btn('Profili düzenle','profile','primary'))+producerCard()+`<div class="panel"><p class="muted">Bu bilgiler yalnızca bu cihazda saklanır ve fotoğraflı yedeğe dahildir. GitHub Pages üzerinden paylaşılmaz.</p></div>`}
function dashboard(){let chicks=cache.broods.reduce((n,b)=>n+(b.chickIds||[]).length,0);return head('Üretim kayıtların','Yuvaları, eşleşmeleri ve nesilleri tek yerden takip et.',btn('+ Kanarya ekle','bird:new','primary'))+producerCard()+`<div class="cards"><div class="stat"><small>Yuva</small><strong>${cache.nests.length}</strong></div><div class="stat"><small>Kanarya</small><strong>${cache.birds.length}</strong></div><div class="stat"><small>Aktif eşleşme</small><strong>${cache.pairings.filter(p=>!p.end).length}</strong></div><div class="stat"><small>Kayıtlı yavru</small><strong>${chicks}</strong></div></div><div class="panel"><div class="sectionhead"><h2>Yuvalar</h2>${btn('+ Yuva ekle','nest:new')}</div>${cache.nests.length?`<div class="grid">${cache.nests.slice(0,8).map(nestCard).join('')}</div>`:`<div class="empty">İlk yuvanı ekleyerek başla. Sonra anne ve babayı kaydedip yuvada eşleştirebilirsin.<p>${btn('+ İlk yuvayı ekle','nest:new','primary')}</p></div>`}</div><div class="panel"><div class="sectionhead"><h2>Son eklenen kanaryalar</h2><button class="link" data-go="birds">Tümünü gör</button></div><div class="grid">${cache.birds.slice(-4).reverse().map(birdCard).join('')||'<span class="muted">Henüz kanarya kaydı yok.</span>'}</div></div>`}
function nests(){return head('Yuvalar','Fiziksel yuvaları ve geçmiş eşleşmeleri görüntüle.',btn('+ Yuva ekle','nest:new','primary'))+`<div class="grid">${cache.nests.map(nestCard).join('')||'<div class="empty">Henüz yuva yok.</div>'}</div>`}function birds(){return head('Kanaryalar','Bilezik numarası, isim veya renkle ara.',btn('+ Kanarya ekle','bird:new','primary'))+`<div class="toolbar"><input id="search" placeholder="Kanarya veya bilezik ara..." aria-label="Kanarya ara"><select id="sexfilter"><option value="">Tüm cinsiyetler</option><option value="M">Erkek</option><option value="F">Dişi</option><option value="U">Bilinmiyor</option></select></div><div class="grid" id="birdlist"></div>`}function filterBirds(){let q=($('#search')?.value||'').toLocaleLowerCase('tr'),s=$('#sexfilter')?.value;$('#birdlist').innerHTML=cache.birds.filter(b=>(!s||b.sex===s)&&[b.name,b.ring,b.color,b.breed].some(v=>String(v||'').toLocaleLowerCase('tr').includes(q))).map(birdCard).join('')||'<div class="empty">Eşleşen kanarya bulunamadı.</div>'}
function nestDetail(n){if(!n)return go('nests');let ps=cache.pairings.filter(x=>x.nestId===n.id).sort((a,b)=>b.start.localeCompare(a.start)),p=ps[0];return `<div class="breadcrumbs"><button class="link" data-go="nests">← Yuvalar</button></div>`+head(esc(n.name),esc(n.notes||'Fiziksel yuva · Yeni üretim dönemlerinde aynı yuva numarasını kullan.'),btn('Yuvayı düzenle',`nest:${n.id}`)+btn('+ Eşleşme',`pair:${n.id}`,'primary'))+(p?`<div class="detailpair"><div class="panel"><div class="eyebrow">BABA · ERKEK</div><div class="parent">${photo(bird(p.maleId))}<div><h3>${esc(label(bird(p.maleId)))}</h3><p>Bilezik: ${esc(bird(p.maleId)?.ring||'—')}</p><button class="link" data-go="bird:${p.maleId}">Profili aç →</button></div></div></div><div class="panel"><div class="eyebrow">ANNE · DİŞİ</div><div class="parent">${photo(bird(p.femaleId))}<div><h3>${esc(label(bird(p.femaleId)))}</h3><p>Bilezik: ${esc(bird(p.femaleId)?.ring||'—')}</p><button class="link" data-go="bird:${p.femaleId}">Profili aç →</button></div></div></div></div>`:'<div class="empty">Bu yuvada eşleşme yok. Önce kanaryaları ekle, ardından eşleşme oluştur.</div>')+`<div class="panel"><div class="sectionhead"><h2>Kuluçkalar ve yavrular</h2>${p?btn('+ Kuluçka',`brood:${p.id}`):''}</div>${p?broodRows(p):'<span class="muted">Henüz kayıt yok.</span>'}</div><div class="panel"><h2>Bu yuvanın üretim dönemleri</h2><p class="subtle">Yuva numarası sabit kalır. Her yeni anne ve baba için yeni bir eşleşme açılır; eski yavrular kendi döneminde saklanır.</p>${ps.map((x,i)=>`<div class="record"><strong>${esc(n.name)} · ${esc(x.start?.slice(0,4)||'Tarihsiz')} / ${ps.length-i}. eşleşme: ${esc(label(bird(x.maleId)))} + ${esc(label(bird(x.femaleId)))}</strong><div class="subtle">${date(x.start)} – ${x.end?date(x.end):'Devam ediyor'} · ${cache.broods.filter(b=>b.pairingId===x.id).length} kuluçka</div><div class="row"><button class="link" data-action="pair:${x.nestId}:${x.id}">Düzenle</button><button class="link" data-go="pair:${x.id}">Kuluçkaları gör</button></div>${x.id!==p?.id?broodRows(x):''}</div>`).join('')||'<p class="muted">Eşleşme geçmişi boş.</p>'}</div>`}
function broodRows(p){let bs=cache.broods.filter(b=>b.pairingId===p.id).sort((a,b)=>(b.layDate||'').localeCompare(a.layDate||''));return bs.map((b,i)=>`<div class="record"><div class="sectionhead"><div><strong>Kuluçka ${bs.length-i}</strong><div class="subtle">Yumurtlama: ${date(b.layDate)} · Çıkım: ${date(b.hatchDate)} · Yumurta: ${b.eggCount??'—'} · Çıkan: ${b.hatchedCount??'—'}</div></div><div class="row"><button class="link" data-action="brood:${p.id}:${b.id}">Düzenle</button>${btn('+ Yavru',`chick:${b.id}`)}</div></div><div class="grid">${(b.chickIds||[]).map(id=>bird(id)).filter(Boolean).map(birdCard).join('')||'<span class="muted">Henüz yavru eklenmedi.</span>'}</div>${b.notes?`<p class="subtle">${esc(b.notes)}</p>`:''}</div>`).join('')||'<div class="empty">İlk kuluçkayı ekle.</div>'}
function pairDetail(p){if(!p)return go('nests');return `<div class="breadcrumbs"><button class="link" data-go="nest:${p.nestId}">← ${esc(nest(p.nestId)?.name)}</button></div>`+head('Eşleşme kayıtları',`${esc(label(bird(p.maleId)))} + ${esc(label(bird(p.femaleId)))} · ${date(p.start)}`,btn('+ Kuluçka',`brood:${p.id}`,'primary'))+`<div class="panel">${broodRows(p)}</div>`}
function birdDetail(b){if(!b)return go('birds');let mother=bird(b.motherId),father=bird(b.fatherId),offs=cache.birds.filter(x=>x.motherId===b.id||x.fatherId===b.id),used=cache.pairings.filter(x=>x.maleId===b.id||x.femaleId===b.id);return `<div class="breadcrumbs"><button class="link" data-go="birds">← Kanaryalar</button></div>`+head(esc(label(b)),`${sex(b.sex)} · ${esc(b.ring||'Bilezik numarası yok')}`,btn('Düzenle',`bird:${b.id}`,'primary'))+`<div class="panel"><div class="parent">${photo(b)}<div><div class="eyebrow">KANARYA PROFİLİ</div><h2>${esc(label(b))}</h2><p>Doğum: ${date(b.birth)} · Renk: ${esc(b.color||'—')} · Grup: ${esc(b.category||'—')} · Irk/çeşit: ${esc(b.breed||'—')}</p><p>Durum: ${esc(b.status||'Kayıtlı')} ${b.notes?' · '+esc(b.notes):''}</p></div></div></div><div class="lineage"><div class="panel"><h2>Anne ve baba</h2><div class="grid">${[father,mother].filter(Boolean).map(birdCard).join('')||'<p class="muted">Ebeveyn bağlantısı yok.</p>'}</div></div><div class="panel"><h2>Yavruları (${offs.length})</h2><div class="grid">${offs.map(birdCard).join('')||'<p class="muted">Kayıtlı yavrusu yok.</p>'}</div></div></div><div class="panel"><h2>Soy zinciri</h2><p class="subtle">Kartlara tıklayarak nesiller arasında ilerleyebilirsin.</p><div class="tree"><div class="treelevel">${[bird(father?.fatherId),bird(father?.motherId),bird(mother?.fatherId),bird(mother?.motherId)].filter(Boolean).map(x=>`<button class="tag" data-go="bird:${x.id}"><strong>${esc(label(x))}</strong><small>Büyük ebeveyn</small></button>`).join('')}</div><div class="treelevel">${[father,mother].filter(Boolean).map(x=>`<button class="tag" data-go="bird:${x.id}"><strong>${esc(label(x))}</strong><small>Ebeveyn</small></button>`).join('')}</div><div class="treelevel"><span class="tag"><strong>${esc(label(b))}</strong><small>Seçili kanarya</small></span></div><div class="treelevel">${offs.map(x=>`<button class="tag" data-go="bird:${x.id}"><strong>${esc(label(x))}</strong><small>Yavru</small></bu
